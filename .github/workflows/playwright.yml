name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      e2e-base-url:
        description: "Base URL for E2E tests"
        required: false
        default: "https://grumma.org"
jobs:
  test:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps --ignore-scripts
      - name: Run Playwright tests
        env:
          E2E_BASE_URL: ${{ inputs.e2e-base-url }}
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
