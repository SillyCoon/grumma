name: Build and test

on:
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411
        with:
          cache: true
      - run: pnpm run check
      - run: pnpm run --filter="*" build
      - run: pnpm run test
      - run: pnpm run test:integration
