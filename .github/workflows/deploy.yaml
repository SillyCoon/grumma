name: Deploy
on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]

env:
  IMAGE_NAME: grumma
  PROJECT_ID: gramma-400100
  SERVICE: grumma-oss
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev/gramma-400100/grumma
  PUBLIC_URL: https://grumma.org
  DATABASE_URL: ${{secrets.DATABASE_URL}}
  PUBLIC_REAL_TIME_CONTENT_UPDATE: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: "v2.2.4"

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed"
        with:
          token_format: "access_token"
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: ${{secrets.SERVICE_ACCOUNT}}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          username: "oauth2accesstoken"
          password: "${{ steps.auth.outputs.access_token }}"
          registry: "${{ env.REGION }}-docker.pkg.dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          cache: true
      - run: pnpm exec drizzle-kit migrate
  deploy:
    needs: [publish, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed"
        with:
          project_id: "${{ env.PROJECT_ID }}"
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"

      - name: Create Service declaration
        run: |-
          export IMAGE="${{ needs.publish.outputs.image }}"
          export SERVICE="${{ env.SERVICE }}"
          export PUBLIC_REAL_TIME_CONTENT_UPDATE=${{env.PUBLIC_REAL_TIME_CONTENT_UPDATE}}
          envsubst < gcloud/service.template.yaml > service.yaml
          cat service.yaml

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          metadata: "service.yaml"

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
