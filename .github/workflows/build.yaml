name: Build and test

on:
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a
      - run: mise run build
      - run: mise run test
      - run: mise run integration-test
