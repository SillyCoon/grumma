name: Build and test

on:
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
      - run: mise run build
      - run: mise run test
      - run: mise run integration-test
